name: Build Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Map fusion-common Git URL to HTTPS for CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global url."https://github.com/ioyurev/fusion-common.git".insteadOf "ssh://git@gitflic.ru/i-o-yurev/fusion-common.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Pandoc is available
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command pandoc -ErrorAction SilentlyContinue)) {
            $headers = @{
              'User-Agent'    = 'fusion-release-workflow'
              'Authorization' = "Bearer $env:GH_TOKEN"
            }
            $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/jgm/pandoc/releases/latest' -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -match '^pandoc-.*-windows-x86_64\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw 'Pandoc windows-x86_64 zip asset not found in latest release' }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile pandoc.zip
            Expand-Archive -Path pandoc.zip -DestinationPath pandoc_extracted -Force
            $pandocBin = Get-ChildItem -Path 'pandoc_extracted' -Recurse -Filter 'pandoc.exe' | Select-Object -First 1
            if (-not $pandocBin) { throw 'pandoc.exe not found inside extracted archive' }
            $pandocBin.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$($pandocBin.Directory.FullName);$env:PATH"
          }
          pandoc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download FFmpeg 9.0 GPL Shared binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg_shared.zip
          Expand-Archive -Path ffmpeg_shared.zip -DestinationPath ffmpeg_extracted -Force

      - name: Build PyInstaller bundle, HTML manual, ZIP and Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([scriptblock]$Cmd) {
            & $Cmd
            if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
          }
          New-Item -ItemType Directory -Force -Path pyinstaller | Out-Null
          Push-Location pyinstaller
          Invoke-Checked { uv run fusion-splash --subtitle "Thermal Analysis Tool" --bg-color "#1E293B" --svg-out ../assets/icon.svg --icon-out icon.ico --version-from .. --out splash.png }
          Invoke-Checked { uv run pyinstaller ../fusion_analysis/__main__.py --noconsole -i icon.ico --splash splash.png --collect-data fusion_common --collect-data fusion_analysis -n fusion-analysis --noconfirm --exclude-module PyQt6 --exclude-module PyQt5 --exclude-module scipy }
          Invoke-Checked { uv run fusion-packaging version-file --package fusion-analysis --product "Fusion Analysis" --description "Fusion Analysis" --version-from .. --out version_text_file }
          Invoke-Checked { uv run pyi-set_version version_text_file dist/fusion-analysis/fusion-analysis.exe }
          Invoke-Checked { uv run fusion-docs --package fusion_analysis --out-dir dist/fusion-analysis }
          if (-not (Test-Path 'dist/fusion-analysis/MANUAL.html')) { throw 'MANUAL.html was not generated' }
          if (-not (Test-Path 'dist/fusion-analysis/LICENSE.html')) { throw 'LICENSE.html was not generated' }
          $ffDest = New-Item -ItemType Directory -Force -Path "dist/fusion-analysis/ffmpeg"
          $ffBin = Get-ChildItem -Path "../ffmpeg_extracted/*/bin" -Directory | Select-Object -First 1
          if (-not $ffBin) { throw 'Extracted FFmpeg bin directory not found' }
          Copy-Item "$($ffBin.FullName)/ffmpeg.exe" $ffDest
          Copy-Item "$($ffBin.FullName)/ffprobe.exe" $ffDest
          Copy-Item "$($ffBin.FullName)/*.dll" $ffDest
          if (-not (Test-Path 'dist/fusion-analysis/ffmpeg/ffmpeg.exe')) { throw 'ffmpeg.exe missing in bundle' }
          if (-not (Test-Path 'dist/fusion-analysis/ffmpeg/ffprobe.exe')) { throw 'ffprobe.exe missing in bundle' }
          Invoke-Checked { uv run fusion-packaging zip-dist --package fusion-analysis --version-from .. --dist-root dist }
          Invoke-Checked { uv run fusion-packaging installer --package fusion-analysis --product "Fusion Analysis" --version-from .. --dist-root dist --icon icon.ico }
          Pop-Location

      - name: Upload installer and portable archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fusion-analysis-windows-x64
          path: |
            pyinstaller/dist/*_setup_v*.exe
            pyinstaller/dist/*_v*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pyinstaller/dist/*_setup_v*.exe
            pyinstaller/dist/*_v*.zip
          generate_release_notes: true
