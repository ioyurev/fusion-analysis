[tool.poetry]
name = "fusion-analysis"
version = "0.0.1"
description = ""
authors = ["Ilya Yurev <i.o.yurev@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
PySide6 = "^6.6.0"
numpy = "^1.26.2,<2"
pandas = "^2.1.3"
Pint = "^0.22"
matplotlib = "^3.8.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
ruff = "^0.1.6"
autoflake = "^2.2.1"
pyinstaller = "^6.2.0"
commitizen = "^3.12.0"
mypy = "^1.7.1"
Pillow = "^10.1.0"
types-pyinstaller = "^6.2.0.1"
pandas-stubs = "^2.1.1.230928"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version = "0.0.1"
version_files = [
    "fusion-analysis/__version__.py",
    "pyproject.toml:version"
    ]
update_changelog_on_bump = true
major_version_zero = true
