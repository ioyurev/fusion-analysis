[project]
name = "fusion-analysis"
version = "0.3.0"
description = "Приложение для обработки и анализа кривых термического анализа (ВТА, ДТА, ТГ)"
authors = [{ name = "Ilya O. Yurev", email = "i.o.yurev@yandex.ru" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg-progress-yield>=0.7.8",
    "ffmpeg-python>=0.2.0",
    "fusion-common",
    "loguru>=0.7.3",
    "numpy>=2.2.0",
    "opencv-python>=4.10.0",
    "pydantic>=2.11.0",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.9.0",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
fusion-analysis = "fusion_analysis.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.13.0",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
    "vulture>=2.14",
]

[tool.uv.sources]
fusion-common = { git = "ssh://git@gitflic.ru/i-o-yurev/fusion-common.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_analysis"]

[tool.vulture]
min_confidence = 60
paths = ["fusion_analysis", "tests", "vulture_whitelist.py"]
